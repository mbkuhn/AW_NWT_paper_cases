
kynema_driver:
  kynema_ugf_inp:
    - platform1_ugf_rst.yaml
    - platform2_ugf_rst.yaml
    - platform3_ugf_rst.yaml
    - platform4_ugf_rst.yaml
  kynema_sgf_inp: offshore_array_sgf_rst.inp
  max_time: 3675
  additional_picard_iterations: 2

  ugf_vars:
    - volume_of_fluid
    - velocity
    - density
    - pressure
  sgf_cell_vars:
    - vof
    - velocity
    - density
  sgf_node_vars:
    - p
